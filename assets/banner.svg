<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Spartan Studio: Android apps designed and built by Mathi">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff7a2f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#0e0e10"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#ff8a45" font-size="22" font-weight="600" letter-spacing="5">ANDROID STUDIO · BY MATHI</text>
    <text x="72" y="210" fill="#ffffff" font-size="88" font-weight="700" letter-spacing="-2">Spartan Studio</text>
    <text x="74" y="264" fill="#c9c9cf" font-size="28">Personal Android apps, designed by me and built with AI.</text>
    <text x="74" y="306" fill="#8b8b93" font-size="22">Free to download · No ads · Your data stays on your phone</text>
  </g>
  <g transform="translate(1000 180)">
    <circle r="92" fill="none" stroke="#ff7a2f" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="62" fill="none" stroke="#ff7a2f" stroke-opacity="0.6" stroke-width="2"/>
    <circle r="30" fill="#ff7a2f"/>
  </g>
</svg>
